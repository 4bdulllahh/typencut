<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Typencut: the W keycap seen from the front right, skidding sideways with tyre marks and smoke behind it. -->
  <g fill="none" stroke-linecap="round" stroke="#2a2a30" opacity="0.5">
    <path d="M17 50 C12 53 7 56 1 62" stroke-width="5" />
    <path d="M34 53 C28 56 22 59 14 63.5" stroke-width="5" />
  </g>
  <path d="M8 26 H2 M9 33 H4" stroke="#9aa0aa" stroke-width="2.6" stroke-linecap="round" />
  <circle cx="12" cy="49" r="4.5" fill="#dfe2e7" />
  <circle cx="6" cy="52" r="3" fill="#dfe2e7" opacity="0.8" />
  <g transform="rotate(-14 34 32)" stroke="#1d1d22" stroke-width="3.2" stroke-linejoin="round">
    <ellipse cx="35" cy="51" rx="22" ry="3.5" fill="#1d1d22" opacity="0.2" stroke="none" />
    <!-- skirt: front wall, then the right wall in shade -->
    <path d="M18 39 L45 37 L53 47 L13 50 Z" fill="#c3c8d0" />
    <path d="M43 11 L45 37 L53 47 L55 17 Z" fill="#9aa1ac" />
    <!-- top face -->
    <path d="M16 13 L43 11 L45 37 L18 39 Z" fill="#f7f7f5" />
    <!-- the W, laid on the top face -->
    <path d="M21 17.9 L26.8 33.1 L30.3 22.4 L35.4 32.5 L38.8 16.5" fill="none" stroke-width="4.6" stroke-linecap="round" />
  </g>
</svg>
